name: .NET (build, test, pack, publish)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet version (overrides csproj Version). Example: 0.2.0 or 0.2.0-beta.1"
        required: false
        type: string

jobs:
  build_test_pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore qti-uploader.sln

      - name: Build
        run: dotnet build qti-uploader.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test qti-uploader.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: |
          dotnet pack src/Citolab.QTI.Uploader/Citolab.QTI.Uploader.csproj --configuration Release --no-build --no-restore --output ./nupkgs -p:ContinuousIntegrationBuild=true -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
          dotnet pack src/Citolab.QTI.Converter/Citolab.QTI.Converter.csproj --configuration Release --no-build --no-restore --output ./nupkgs -p:ContinuousIntegrationBuild=true -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*

  publish:
    needs: build_test_pack
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Determine version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$DISPATCH_VERSION" ]]; then
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore qti-uploader.sln

      - name: Build
        run: dotnet build qti-uploader.sln --configuration Release --no-restore

      - name: Pack (versioned)
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            VERSION_ARG="-p:PackageVersion=$PACKAGE_VERSION"
          else
            VERSION_ARG=""
          fi
          dotnet pack src/Citolab.QTI.Uploader/Citolab.QTI.Uploader.csproj --configuration Release --no-build --no-restore --output ./nupkgs -p:ContinuousIntegrationBuild=true -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg $VERSION_ARG
          dotnet pack src/Citolab.QTI.Converter/Citolab.QTI.Converter.csproj --configuration Release --no-build --no-restore --output ./nupkgs -p:ContinuousIntegrationBuild=true -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg $VERSION_ARG

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkgs/Citolab.QTI.Uploader.*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "$NUGET_API_KEY"
          dotnet nuget push "nupkgs/Citolab.QTI.Converter.*.nupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "$NUGET_API_KEY"
          dotnet nuget push "nupkgs/*.snupkg" --source https://api.nuget.org/v3/index.json --skip-duplicate --api-key "$NUGET_API_KEY"
